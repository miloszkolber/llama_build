name: gate
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Separate gate source repository (owner/name)'
        type: string
        required: true
      source_ref:
        description: 'Gate source commit or tag'
        type: string
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: gate-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: gate-source
          token: ${{ secrets.GATE_SOURCE_TOKEN || github.token }}
      - name: Resolve image and source identity
        id: identity
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/gate" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C gate-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Gate source tests
        working-directory: gate-source/server
        run: CGO_ENABLED=0 go test ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: gate-source
          file: gate/Dockerfile
          load: true
          tags: gate-smoke:local
      - run: docker run --rm gate-smoke:local --health
      - uses: docker/build-push-action@v6
        with:
          context: gate-source
          file: gate/Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ steps.identity.outputs.sha }}
          tags: |
            ${{ steps.identity.outputs.image }}:candidate
            ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
