name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'compose/**']
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      llama_sha:
        description: 'llama.cpp commit'
        required: false
        default: 'e937b17a2'
      whisper_ref:
        description: 'whisper.cpp ref (pin to SHA after first green build)'
        required: false
        default: 'master'

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/llama-edge

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail fast on moved driver packages
        run: |
          grep -oE 'https://github\.com/[^ "]+' Dockerfile | sort -u | while read -r u; do
            curl -fsI -o /dev/null --retry 2 "$u" || { echo "dead URL: $u"; exit 1; }
          done
          echo URLs alive

  build:
    needs: check-urls
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v5
      - uses: docker/setup-buildx-action@v5
      - uses: docker/login-action@v5
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            LLAMA_SHA=${{ inputs.llama_sha || 'e937b17a2' }}
            WHISPER_REF=${{ inputs.whisper_ref || 'master' }}
            GATE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/gate:latest
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:edge
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:edge-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:edge-${{ github.run_number }}
