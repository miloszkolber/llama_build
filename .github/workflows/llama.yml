name: llama_runtime
on:
  schedule:
    - cron: '0 0,1 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag override (empty = automatic policy)'
        type: string
        default: ''
permissions:
  contents: read
  packages: write
jobs:
  build:
    uses: ./.github/workflows/runtime.yml
    with:
      component: llama
      backend: sycl
      release_tag: ${{ inputs.release_tag || '' }}
    secrets: inherit
