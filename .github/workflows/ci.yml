name: Validate draft
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Entrypoint and probe tests
        run: |
          (cd probe && go test ./... && go vet ./...)
          (cd launcher && go test ./... && go vet ./...)
      - name: Release policy tests
        run: python3 -m unittest discover -s tests -v
      - name: Compose contract
        run: |
          cp compose/llama.env.example compose/llama.env
          cp compose/whisper.env.example compose/whisper.env
          cp compose/models.ini.example compose/models.ini
          docker compose --env-file compose/.env.example -f compose/docker-compose.yaml --profile runtime config --format json > compose.json
          python3 scripts/check-compose.py compose.json
      - name: Workflow syntax and expressions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - uses: docker/setup-buildx-action@v3
      - name: Dockerfile static checks (no compilation)
        run: |
          docker buildx build --check --target llama_runtime .
          docker buildx build --check --target whisper_runtime .
      - name: Whitespace
        run: git diff --check
