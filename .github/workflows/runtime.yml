name: Build runtime
on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      backend:
        type: string
        required: true
      release_tag:
        type: string
        default: ''
permissions:
  contents: read
  packages: write
concurrency:
  group: runtime-${{ inputs.component }}-${{ inputs.backend }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/release-policy.py "$COMPONENT" --tag "$RELEASE_TAG" --event "$EVENT"
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ inputs.component }}
        run: echo "name=ghcr.io/${OWNER,,}/${COMPONENT}_runtime" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build final image locally for smoke checks
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ inputs.component }}_runtime
          platforms: linux/amd64
          load: true
          tags: runtime-smoke:local
          build-args: |
            LLAMA_SHA=${{ needs.resolve.outputs.sha }}
            WHISPER_REF=${{ needs.resolve.outputs.sha }}
            WHISPER_BACKEND=${{ inputs.backend }}
          cache-from: type=gha,scope=${{ inputs.component }}-${{ inputs.backend }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}-${{ inputs.backend }}
      - name: Check actual final-image binaries and HTTP probe
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          docker run --rm runtime-smoke:local --help
          trap 'docker rm -f probe-server >/dev/null 2>&1 || true' EXIT
          docker run -d --name probe-server python:3.12-slim python -m http.server 8080
          for i in $(seq 1 20); do
            echo "HTTP probe smoke attempt $i"
            if docker run --rm --network container:probe-server --entrypoint /app/probe runtime-smoke:local http://127.0.0.1:8080/; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Publish smoke-tested candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ inputs.component }}_runtime
          platforms: linux/amd64
          push: true
          build-args: |
            LLAMA_SHA=${{ needs.resolve.outputs.sha }}
            WHISPER_REF=${{ needs.resolve.outputs.sha }}
            WHISPER_BACKEND=${{ inputs.backend }}
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ inputs.backend }}-candidate
            ${{ needs.resolve.outputs.image }}:${{ inputs.backend }}-${{ needs.resolve.outputs.tag }}-${{ needs.resolve.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
