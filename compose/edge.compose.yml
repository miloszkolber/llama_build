# Migration sketch for the Phase 1 topology: same three roles as today,
# all served from the single edge image. Host-specific values live in
# .env (see .env.example) so this file stays portable.
services:
  edge-gate:
    image: ${EDGE_IMAGE}
    container_name: edge-gate
    restart: "no"
    network_mode: host
    env_file:
      - ../docker-llama-env
    entrypoint: ["/app/gate"]
    healthcheck:
      test: ["CMD", "/app/gate", "--health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "109"

  edge-llama:
    image: ${EDGE_IMAGE}
    container_name: edge-llama
    restart: "no"
    profiles: [runtime]
    network_mode: host
    env_file:
      - ../docker-llama-env
    entrypoint: ["/app/llama-server"]
    command: ["--no-warmup"]
    read_only: true
    cpuset: "0-5"
    volumes:
      - ${MODELS_DIR}:/models
      - ${LLAMA_CACHE_DIR}:/root/.cache
      - ${MODELS_PRESET_FILE}:/models.ini:ro
    devices:
      - ${DRI_CARD}:/dev/dri/card0
      - ${DRI_RENDER}:/dev/dri/renderD128
    tmpfs:
      - /tmp:rw,size=8g

  edge-whisper:
    image: ${EDGE_IMAGE}
    container_name: edge-whisper
    restart: "no"
    profiles: [runtime]
    network_mode: host
    env_file:
      - ../docker-whisper-env
    entrypoint: ["/app/whisper-server"]
    read_only: true
    volumes:
      - ${MODELS_DIR}:/models:ro
    devices:
      - ${DRI_RENDER}:/dev/dri/renderD128
    tmpfs:
      - /tmp:rw,size=8g
    environment:
      GGML_SYCL_DEVICE: "0"
