services:
  llama-runtime:
    image: ${REGISTRY}/llama_runtime:latest
    pull_policy: always
    container_name: llama-runtime
    restart: "no"
    profiles: [runtime]
    network_mode: host
    env_file: .env
    group_add: ["${RENDER_GID}"]
    command: ["--no-warmup"]
    environment:
      XDG_CACHE_HOME: /home/runtime/.cache
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "/app/probe", "llama"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ${MODELS_DIR}:/models:ro
      - ${CACHE_DIR}:/home/runtime/.cache
      - ./models.ini:/models.ini:ro
    devices: ["${DRI_RENDER}:${DRI_RENDER}"]

  whisper-runtime:
    image: ${REGISTRY}/whisper_runtime:latest
    pull_policy: always
    container_name: whisper-runtime
    restart: "no"
    profiles: [runtime]
    network_mode: host
    env_file: .env
    group_add: ["${RENDER_GID}"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "/app/probe", "whisper"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes: ["${MODELS_DIR}:/models:ro"]
    devices: ["${DRI_RENDER}:${DRI_RENDER}"]

  llama:
    image: ${REGISTRY}/gate:latest
    pull_policy: always
    container_name: llama
    restart: always
    network_mode: host
    env_file: .env
    group_add: ["${DOCKER_GID}"]
    read_only: true
    healthcheck:
      test: ["CMD", "/app/gate", "--health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:rw"]
